---

# need to flush privileges before this sometimes....

- name: Reload privilege tables
  command: 'mysql -ne "{{ item }}"'
  with_items:
    - FLUSH PRIVILEGES
  changed_when: False
  tags: [mysql_users]


- name: Ensure MySQL users are present.
  community.mysql.mysql_user:
    name: "{{ item.name }}"
    host: "{{ item.host | default('localhost') }}"
    password: "{{ item.password }}"
    priv: "{{ item.priv | default('*.*:USAGE') }}"
    state: "{{ item.state | default('present') }}"
    append_privs: "{{ item.append_privs | default('no') }}"
    encrypted: "{{ item.encrypted | default('no') }}"
  with_items: "{{ mysql_users }}"
  become: true
  no_log: "{{ not item.encrypted | default('yes') }}"
  tags: [mysql_users]

- name: Ensure MySQL Admin users are present.
  block:
    - name: set fact3 for inv ips
      set_fact:
        db_allowed_adminips: "{{ incoming_ip_allowlist|map(attribute='ip')|list|unique }}"

    # should check we have allowed ips!!

    - name: Ensure MySQL Admin users are present.
      community.mysql.mysql_user:
        name: "{{ item[0].name }}"
        host: "{{ item[1]| default('localhost') }}"
        password: "{{ item[0].password }}"
        priv: "{{ item[0].priv | default('*.*:USAGE') }}"
        append_privs: true
        encrypted: "{{ item[0].encrypted | default('no') }}"
        state: present
      become: true
      no_log: "{{ not item.0.encrypted | default('yes') }}"
      with_nested:
        - "{{ mysql_adminusers }}"
        - "{{ db_allowed_adminips }}"

    - name: Ensure MySQL Admin users are absent for disallowed host.
      community.mysql.mysql_user:
        name: "{{ item[0].name }}"
        host: "{{ item[1]| default('localhost') }}"
        password: "{{ item[0].password }}"
        priv: "{{ item[0].priv | default('*.*:USAGE') }}"
        append_privs: true
        encrypted: "{{ item[0].encrypted | default('no') }}"
        state: absent
      become: true
      no_log: "{{ not item.0.encrypted | default('yes') }}"
      with_nested:
        - "{{ mysql_adminusers }}"
        - "{{ mysql_disallowed_ips }}"
      when: mysql_disallowed_ips | length > 0

  when: mysql_adminusers is defined
  tags: [mysql_users]
  become: true

- name: Ensure other MySQL users are present.
  community.mysql.mysql_user:
    name: "{{ item.0.name }}"
    host: "{{ item.1| default('localhost') }}"
    password: "{{ item.0.password }}"
    priv: "{{ item.0.priv | default('*.*:USAGE') }}"
    encrypted: "{{ item.0.encrypted }}"
    append_privs: true
    state: present
  become: true
  no_log: "{{ not item.0.encrypted | default('yes') }}"
  when: mysql_other_users is defined
  with_subelements:
    - "{{ mysql_other_users }}"
    - ips
  tags: [mysql_users]
